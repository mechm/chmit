services:
  db:
    # Use the official pre-built image from Docker Hub
    build: ./db
    restart: always
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: lymm
      POSTGRES_DB: chmit
    ports:
      - "5432:5432"
    volumes:
      # Persist the data on the host machine
      - postgres_data:/var/lib/postgresql/data
       ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: